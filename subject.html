<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09090a"><meta name="robots" content="noindex">
<title>Subject · SSC Restart</title><link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="hdr"></div>
<div class="crumb"><a href="index.html">← Home</a></div>
<div class="ttl"><h1 id="t">Subject</h1><div class="hi" id="h" style="color:var(--mut)"></div></div>
<main><div class="list" id="list"><div class="empty">Loading…</div></div></main>
<footer><b>SSC RESTART</b><br>Reset · Plan · Study · Practice · Revise · Repeat</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="shared.js"></script>
<script>
(async()=>{
  const s=await requireLogin(); if(!s)return;
  renderHeader(await myRole(s.user.id));
  const id=(new URLSearchParams(location.search).get('s')||'').toLowerCase();
  const sec=SECTIONS.find(x=>x.id===id);
  if(!sec){$('list').innerHTML='<div class="empty">Subject not found.</div>';return}
  $('t').textContent=sec.name; $('h').textContent=sec.hi; document.title=sec.name+' · SSC Restart';
  const {data,error}=await SB.from('items').select('*').eq('section',id).order('sort_order');
  $('list').innerHTML=error?'<div class="empty">Could not load. Please refresh.</div>':(data.length?data.map(row).join(''):'<div class="empty"><b style="display:block;color:var(--cream);font:800 1.3rem Playfair Display,serif;margin-bottom:6px">Coming soon</b>Join @ssc_restart on Telegram to know when new material arrives.</div>');
})();
</script></body></html>
