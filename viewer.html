<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09090a"><meta name="robots" content="noindex">
<title>Reading · SSC Restart</title><link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<style>
html,body{height:100%;overflow:hidden}
.vb{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(10,8,7,.95);border-bottom:1px solid var(--line);z-index:5}
.vb a{font:600 .8rem Inter;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));padding:8px 14px;border-radius:999px}
.vb a.g{background:var(--card);border:1px solid var(--line);color:var(--cream2)}
.vb span{font:700 .9rem 'Playfair Display',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#fr{position:fixed;top:50px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 50px);border:0;background:#fff}
#wm{position:fixed;top:50px;left:0;right:0;bottom:0;pointer-events:none;z-index:4}
#ld{position:fixed;top:50px;left:0;right:0;bottom:0;display:grid;place-items:center;color:var(--mut);z-index:3;text-align:center;padding:20px}
</style>
<div class="vb"><a href="index.html">⌂ Home</a><a class="g" href="javascript:history.back()">← Back</a><span id="tt"></span></div>
<div id="ld">Loading… large files can take a little while.</div>
<iframe id="fr" title="Content" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-downloads"></iframe>
<div id="wm"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="shared.js"></script>
<script>
(async()=>{
  const s=await requireLogin(); if(!s)return;
  const q=new URLSearchParams(location.search), p=q.get('p')||'';
  $('tt').textContent=q.get('t')||''; document.title=(q.get('t')||'Reading')+' · SSC Restart';
  if(!/^[\w\-./]+\.html$/.test(p)||p.includes('..')){$('ld').textContent='Invalid file.';return}
  const {data,error}=await SB.storage.from('content').download(p);
  if(error||!data){$('ld').textContent='Could not open this file. Please log in again.';return}
  let html=await data.text();
  const shim='<style>#ssc-home{display:none!important}</style><script>try{var mk=function(){var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}}};Object.defineProperty(window,"localStorage",{value:mk()});Object.defineProperty(window,"sessionStorage",{value:mk()})}catch(e){}<\/script>';
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+shim):shim+html;
  $('fr').onload=()=>{$('ld').style.display='none'};
  $('fr').src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const em=(s.user.email||'').replace(/[<&>]/g,'');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><text x="20" y="110" transform="rotate(-24 160 100)" font-family="sans-serif" font-size="15" fill="rgba(128,128,128,0.16)">${em}</text></svg>`;
  $('wm').style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
})();
</script></body></html>
