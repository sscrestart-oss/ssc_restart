<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09090a"><meta name="robots" content="noindex">
<title>Admin console · SSC Restart</title><link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="top-in"><a class="brand" href="index.html"><img src="logo.jpg" alt="logo"><span><b>ADMIN <i>CONSOLE</i></b><small>SSC Restart</small></span></a>
<span class="rt" id="tb" hidden><button class="pill" id="kb">⌘K Commands</button><a class="pill" href="index.html" target="_blank" rel="noopener">View site</a><button class="pill l" id="so">Log out</button></span></div></header>
<div id="app"><div class="box"><h2>Checking access…</h2></div></div>
<div class="pal" id="pal" hidden><div><input id="pi" type="text" placeholder="Type a command or a name…" autocomplete="off"><ul id="pl"></ul></div></div>
<div class="toast" id="ts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="shared.js"></script>
<script>
let D,X,SEL=null,VIEW='node',PEND=[];
const app=$('app');
const T=(m,k)=>{const t=$('ts');t.textContent=m;t.className='toast on '+(k||'');clearTimeout(T.h);T.h=setTimeout(()=>t.className='toast',3400)};
const nextOrder=l=>l.length?Math.max(...l.map(x=>x.sort_order))+1:0;
const depthOf=n=>{let d=0;while(n&&n.parent_id){n=X.byId[n.parent_id];d++}return d};
const kindAt=d=>d===0?'section':d===1?'chapter':'topic';
const labelAt=d=>d===0?'Section':d===1?'Chapter':'Topic';
const childLabel=d=>d===0?'Chapters':d===1?'Topics':'Sub-topics';
const pathOf=n=>{const a=[];while(n){a.unshift(n.title);n=n.parent_id?X.byId[n.parent_id]:null}return a};
const subtree=id=>{let a=[id];(X.kids[id]||[]).forEach(c=>a=a.concat(subtree(c.id)));return a};
const sibs=n=>X.kids[n?n.parent_id||ROOT:ROOT]||[];
async function reload(){D=await loadAll();X=buildIndex(D);if(D.error)T(D.error.message,'err')}
async function ok(p,msg){const r=await p;if(r&&r.error){T(r.error.message,'err');return false}if(msg)T(msg);await reload();draw();return true}

/* ---------- boot + two-factor ---------- */
(async()=>{
  const s=await requireLogin();if(!s)return;
  if(await myRole(s.user.id)!=='admin'){app.innerHTML='<div class="box"><h2>Admins only</h2><p class="s">This account does not have admin access.</p><a class="btn tg" href="index.html">Back to site</a></div>';return}
  const {data:a}=await SB.auth.mfa.getAuthenticatorAssuranceLevel();
  if(a&&a.currentLevel==='aal2')return start();
  gate();
})();
async function gate(){
  const {data:f}=await SB.auth.mfa.listFactors();const all=(f&&f.all)||[];
  for(const x of all.filter(x=>x.status==='unverified'))await SB.auth.mfa.unenroll({factorId:x.id});
  const ok=all.find(x=>x.factor_type==='totp'&&x.status==='verified');let fid,extra='';
  if(ok)fid=ok.id;else{
    const {data,error}=await SB.auth.mfa.enroll({factorType:'totp',friendlyName:'SSC Restart admin'});
    if(error){app.innerHTML='<div class="box"><h2>Setup error</h2><p class="s">'+esc(error.message)+'</p></div>';return}
    fid=data.id;extra=`<p class="s">First time: scan with Google Authenticator or Authy. Do not share a screenshot of this.</p><div class="qr"><img alt="QR code" src="${esc(data.totp.qr_code)}"></div><code class="k">${esc(data.totp.secret)}</code>`;
  }
  app.innerHTML=`<div class="box"><h2>Admin verification</h2><p class="s">Enter the 6-digit code from your authenticator app.</p>${extra}<form id="mf"><label for="cd">6-digit code</label><input id="cd" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required><button class="go" type="submit">Verify</button></form><div class="msg" id="am"></div></div>`;
  $('mf').onsubmit=async e=>{e.preventDefault();const m=$('am');m.className='msg';
    const ch=await SB.auth.mfa.challenge({factorId:fid});if(ch.error){m.className='msg err';m.textContent=ch.error.message;return}
    const v=await SB.auth.mfa.verify({factorId:fid,challengeId:ch.data.id,code:$('cd').value.trim()});
    if(v.error){m.className='msg err';m.textContent='Wrong code. Try again.';return}location.reload()};
}
async function logout(){await SB.auth.signOut();location.replace('login.html')}
async function start(){
  $('tb').hidden=false;$('so').onclick=logout;$('kb').onclick=openPal;
  app.innerHTML='<div class="adm"><aside id="tr"></aside><section id="ed"></section></div>';
  await reload();draw();
}

/* ---------- drawing ---------- */
function draw(){drawTree();VIEW==='settings'?drawSettings():VIEW==='log'?drawLog():drawNode()}
function drawTree(){
  const rows=(pid,d)=>(X.kids[pid]||[]).map(n=>`<div class="tn${n.id===SEL&&VIEW==='node'?' on':''}${n.hidden?' off':''}" data-sel="${n.id}" style="padding-left:${12+d*16}px">${icon(n.icon)}<span>${esc(n.title)}</span>${n.hidden?'<i>hidden</i>':''}</div>`+rows(n.id,d+1)).join('');
  $('tr').innerHTML=`<div class="tr-h"><b>Content</b><button class="act sm p" data-a="root">+ Section</button></div>${rows(ROOT,0)||'<div class="hint" style="padding:12px">No sections yet.</div>'}<div class="tr-f" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px"><button class="act sm" data-a="view" data-v="settings">Site settings</button><button class="act sm" data-a="view" data-v="log">Activity</button></div>`;
}
function resLines(list){
  return list.length?list.map((r,i)=>`<div class="line"><span class="k">${r.kind}</span><div class="t ${r.hidden?'off':''}"><input type="text" value="${esc(r.title)}" data-rt="${r.id}" maxlength="200" aria-label="Name"></div><button class="act sm" data-a="rup" data-id="${r.id}" ${i?'':'disabled'}>↑</button><button class="act sm" data-a="rdn" data-id="${r.id}" ${i<list.length-1?'':'disabled'}>↓</button><button class="act sm" data-a="rhide" data-id="${r.id}">${r.hidden?'Show':'Hide'}</button><button class="act sm del" data-a="rdel" data-id="${r.id}">Delete</button></div>`).join(''):'<div class="hint">Nothing attached yet.</div>';
}
function drawNode(){
  const n=SEL&&X.byId[SEL];
  if(!n){$('ed').innerHTML=`<div class="panel"><h3>Create sections</h3><p class="hint">Sections are the big tiles on the home page (for example Maths, English). Type one name per line.</p><textarea id="k_new" placeholder="Reasoning&#10;General Studies&#10;Maths"></textarea><div class="bar"><button class="act p" data-a="addkids">Add sections</button></div></div><div class="panel"><h3>Tip</h3><p class="hint">Press Ctrl or Cmd + K to open the command bar and jump anywhere, or choose a section on the left.</p></div>`;return}
  const d=depthOf(n),kids=X.kids[n.id]||[],rs=X.res[n.id]||[],sb=sibs(n),i=sb.indexOf(n),ex=new Set(subtree(n.id));
  const opts=`<option value="">Top level (a section)</option>`+D.nodes.filter(x=>!ex.has(x.id)).map(x=>`<option value="${x.id}" ${x.id===n.parent_id?'selected':''}>${esc(pathOf(x).join(' › '))}</option>`).join('');
  $('ed').innerHTML=`
  <div class="hint" style="margin-bottom:8px">${esc(pathOf(n).join(' › '))}</div>
  <div class="panel"><h3>${labelAt(d)} details</h3>
    <label for="e_t">Name</label><input id="e_t" type="text" maxlength="200" value="${esc(n.title)}">
    <label for="e_d">Short description (optional)</label><textarea id="e_d" maxlength="500">${esc(n.description)}</textarea>
    <div class="two"><div><label for="e_i">Icon</label><select id="e_i">${Object.keys(ICONS).map(k=>`<option ${k===n.icon?'selected':''}>${k}</option>`).join('')}</select></div>
    <div><label for="e_mv">Move to</label><select id="e_mv">${opts}</select></div></div>
    <div class="bar"><button class="act p" data-a="save">Save</button><button class="act" data-a="move">Move</button><button class="act" data-a="hide">${n.hidden?'Show on site':'Hide from site'}</button>
    <button class="act sm" data-a="nup" ${i?'':'disabled'}>↑ Up</button><button class="act sm" data-a="ndn" ${i<sb.length-1?'':'disabled'}>↓ Down</button><button class="act del" data-a="del" style="margin-left:auto">Delete</button></div></div>
  <div class="panel"><h3>${childLabel(d)}</h3>
    ${kids.length?kids.map((k,j)=>`<div class="line"><div class="t ${k.hidden?'off':''}"><a class="more" data-sel="${k.id}" href="#" onclick="return false">${esc(k.title)}</a></div><button class="act sm" data-a="kup" data-id="${k.id}" ${j?'':'disabled'}>↑</button><button class="act sm" data-a="kdn" data-id="${k.id}" ${j<kids.length-1?'':'disabled'}>↓</button></div>`).join(''):'<div class="hint">None yet.</div>'}
    <label for="k_new">Add ${childLabel(d).toLowerCase()} (one name per line)</label><textarea id="k_new" placeholder="Algebra&#10;Geometry&#10;Percentage"></textarea>
    <div class="bar"><button class="act p" data-a="addkids">Add</button></div></div>
  <div class="panel"><h3>Files, videos and links here</h3>${resLines(rs)}</div>
  <div class="panel"><h3>Upload files</h3><p class="hint">HTML pages open online. PDFs download. Max 50 MB each. Name each file below.</p>
    <input type="file" id="f_in" multiple accept=".html,.pdf" style="margin-top:10px"><div id="f_names"></div>
    <div class="bar"><button class="act p" data-a="upload">Upload</button><span class="hint" id="f_st"></span></div></div>
  <div class="panel"><h3>Add a YouTube video</h3><div class="two"><div><label for="y_url">YouTube link</label><input id="y_url" type="url" placeholder="https://youtu.be/…"></div><div><label for="y_t">Name</label><input id="y_t" type="text" maxlength="200" placeholder="Watch the lecture"></div></div>
    <div class="bar"><button class="act p" data-a="addyt">Add video</button></div></div>
  <div class="panel"><h3>Add an external link</h3><div class="two"><div><label for="l_url">Link (https)</label><input id="l_url" type="url" placeholder="https://…"></div><div><label for="l_t">Name</label><input id="l_t" type="text" maxlength="200"></div></div>
    <div class="bar"><button class="act p" data-a="addlink">Add link</button></div></div>`;
  $('f_in').onchange=()=>{PEND=[...$('f_in').files];$('f_names').innerHTML=PEND.map((f,k)=>`<label for="fn${k}">${esc(f.name)}</label><input id="fn${k}" type="text" maxlength="200" value="${esc(f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '))}">`).join('')};
}
async function drawSettings(){
  const s=D.settings,F=[['site_title','Site title'],['tagline','Tagline under the title'],['telegram','Telegram link'],['youtube','YouTube channel link'],['banner','Announcement bar (leave empty to hide)']];
  $('ed').innerHTML=`<div class="panel"><h3>Site settings</h3>${F.map(([k,l])=>`<label for="s_${k}">${l}</label><input id="s_${k}" type="text" maxlength="300" value="${esc(s[k]||'')}">`).join('')}<div class="bar"><button class="act p" data-a="savesettings">Save settings</button></div></div>`;
}
async function drawLog(){
  $('ed').innerHTML='<div class="panel"><h3>Recent activity</h3><div class="hint">Loading…</div></div>';
  const {data}=await SB.from('audit_log').select('at,action,section,item_title').order('at',{ascending:false}).limit(60);
  $('ed').innerHTML=`<div class="panel"><h3>Recent activity</h3>${(data||[]).map(r=>`<div class="line"><div class="t hint">${new Date(r.at).toLocaleString()} · <b>${esc(r.action)}</b> · ${esc(r.section)} · ${esc(r.item_title)}</div></div>`).join('')||'<div class="hint">No activity yet.</div>'}</div>`;
}

/* ---------- actions ---------- */
async function reorder(table,list,id,dir){
  const i=list.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=list.length)return;
  const a=list.slice();[a[i],a[j]]=[a[j],a[i]];
  await Promise.all(a.map((x,k)=>x.sort_order!==k?SB.from(table).update({sort_order:k}).eq('id',x.id):null));
  await reload();draw();
}
async function upload(){
  const n=SEL&&X.byId[SEL];if(!n||!PEND.length)return T('Choose files first.','err');
  const st=$('f_st');let done=0;
  for(let k=0;k<PEND.length;k++){
    const f=PEND[k],ext=(f.name.split('.').pop()||'').toLowerCase(),name=($('fn'+k).value.trim()||f.name).slice(0,200);
    if(!['html','pdf'].includes(ext)){T('Only .html and .pdf: '+f.name,'err');continue}
    if(f.size>50*1048576){T(f.name+' is over 50 MB.','err');continue}
    st.textContent='Uploading '+(k+1)+' of '+PEND.length+': '+f.name+' …';
    const path=crypto.randomUUID()+'.'+ext;
    const u=await SB.storage.from('content').upload(path,f,{contentType:ext==='html'?'text/html':'application/pdf'});
    if(u.error){T(u.error.message,'err');continue}
    const r=await SB.from('resources').insert({node_id:n.id,kind:ext==='html'?'page':'pdf',title:name,path,sort_order:nextOrder(X.res[n.id]||[])+done});
    if(r.error){await SB.storage.from('content').remove([path]);T(r.error.message,'err');continue}
    done++;
  }
  PEND=[];T(done?done+' file'+(done>1?'s':'')+' published.':'Nothing uploaded.',done?'':'err');await reload();draw();
}
document.addEventListener('click',async e=>{
  const s=e.target.closest('[data-sel]');if(s){SEL=s.dataset.sel;VIEW='node';draw();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,n=SEL&&X.byId[SEL];
  if(a==='root'){SEL=null;VIEW='node';draw();return}
  if(a==='view'){VIEW=b.dataset.v;draw();return}
  if(a==='addkids'){
    const lines=($('k_new').value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return T('Type at least one name.','err');
    const d=n?depthOf(n)+1:0,base=nextOrder(X.kids[n?n.id:ROOT]||[]);
    if(await ok(SB.from('nodes').insert(lines.map((t,k)=>({parent_id:n?n.id:null,kind:kindAt(d),title:t.slice(0,200),sort_order:base+k,icon:d===0?'book':'book'}))),lines.length+' added'))$('k_new')&&($('k_new').value='');return}
  if(a==='save'&&n){if(!$('e_t').value.trim())return T('Name cannot be empty.','err');await ok(SB.from('nodes').update({title:$('e_t').value.trim(),description:$('e_d').value.trim(),icon:$('e_i').value}).eq('id',n.id),'Saved');return}
  if(a==='hide'&&n){await ok(SB.from('nodes').update({hidden:!n.hidden}).eq('id',n.id),n.hidden?'Now visible':'Hidden from site');return}
  if(a==='move'&&n){const p=$('e_mv').value||null;if(p===n.parent_id)return T('Already there.');const np=p?X.byId[p]:null;
    await ok(SB.from('nodes').update({parent_id:p,kind:kindAt(np?depthOf(np)+1:0),sort_order:nextOrder(X.kids[p||ROOT]||[])}).eq('id',n.id),'Moved');return}
  if(a==='nup'&&n)return reorder('nodes',sibs(n),n.id,-1);
  if(a==='ndn'&&n)return reorder('nodes',sibs(n),n.id,1);
  if(a==='kup'||a==='kdn'){const k=X.byId[id];return reorder('nodes',sibs(k),id,a==='kup'?-1:1)}
  if(a==='del'&&n){const ids=subtree(n.id),paths=D.resources.filter(r=>ids.includes(r.node_id)&&r.path).map(r=>r.path),rc=D.resources.filter(r=>ids.includes(r.node_id)).length;
    if(!confirm('Delete "'+n.title+'" with '+(ids.length-1)+' sub-item(s) and '+rc+' file/video entries? This cannot be undone.'))return;
    if(paths.length)await SB.storage.from('content').remove(paths);const par=n.parent_id;
    if(await ok(SB.from('nodes').delete().eq('id',n.id),'Deleted')){SEL=par;draw()}return}
  if(a==='upload')return upload();
  if(a==='addyt'&&n){const v=ytId($('y_url').value.trim());if(!v)return T('That does not look like a YouTube link.','err');
    if(await ok(SB.from('resources').insert({node_id:n.id,kind:'video',title:($('y_t').value.trim()||'Watch video').slice(0,200),url:'https://www.youtube.com/watch?v='+v,sort_order:nextOrder(X.res[n.id]||[])}),'Video added')){}return}
  if(a==='addlink'&&n){const u=$('l_url').value.trim();if(!/^https:\/\/\S+$/i.test(u))return T('Links must start with https://','err');
    await ok(SB.from('resources').insert({node_id:n.id,kind:'link',title:($('l_t').value.trim()||u).slice(0,200),url:u,sort_order:nextOrder(X.res[n.id]||[])}),'Link added');return}
  if(a==='rup'||a==='rdn'){const r=D.resources.find(x=>x.id===id);return reorder('resources',X.res[r.node_id],id,a==='rup'?-1:1)}
  if(a==='rhide'){const r=D.resources.find(x=>x.id===id);await ok(SB.from('resources').update({hidden:!r.hidden}).eq('id',id),r.hidden?'Now visible':'Hidden');return}
  if(a==='rdel'){const r=D.resources.find(x=>x.id===id);if(!confirm('Delete "'+r.title+'"?'))return;if(r.path)await SB.storage.from('content').remove([r.path]);await ok(SB.from('resources').delete().eq('id',id),'Deleted');return}
  if(a==='savesettings'){const rows=['site_title','tagline','telegram','youtube','banner'].map(k=>({key:k,value:$('s_'+k).value.trim()}));await ok(SB.from('settings').upsert(rows,{onConflict:'key'}),'Settings saved');return}
});
document.addEventListener('change',async e=>{const i=e.target.closest('[data-rt]');if(!i)return;const v=i.value.trim();if(!v)return T('Name cannot be empty.','err');
  const {error}=await SB.from('resources').update({title:v}).eq('id',i.dataset.rt);error?T(error.message,'err'):T('Renamed')});

/* ---------- command palette ---------- */
let PI=0,PL=[];
function cmds(){
  const c=[{t:'New section',f:()=>{SEL=null;VIEW='node';draw();setTimeout(()=>$('k_new')&&$('k_new').focus(),30)}},
    {t:'Site settings',f:()=>{VIEW='settings';draw()}},{t:'Activity log',f:()=>{VIEW='log';draw()}},
    {t:'View live site',f:()=>window.open('index.html','_blank')},{t:'Log out',f:logout}];
  const n=SEL&&X.byId[SEL];
  if(n)c.unshift({t:'Add sub-items to “'+n.title+'”',f:()=>{VIEW='node';draw();setTimeout(()=>$('k_new').focus(),30)}},
    {t:'Upload files to “'+n.title+'”',f:()=>{VIEW='node';draw();setTimeout(()=>$('f_in').click(),30)}},
    {t:'Add YouTube video to “'+n.title+'”',f:()=>{VIEW='node';draw();setTimeout(()=>$('y_url').focus(),30)}},
    {t:(n.hidden?'Show':'Hide')+' “'+n.title+'”',f:()=>ok(SB.from('nodes').update({hidden:!n.hidden}).eq('id',n.id),'Done')});
  D.nodes.forEach(x=>c.push({t:'Go to: '+pathOf(x).join(' › '),f:()=>{SEL=x.id;VIEW='node';draw()}}));
  return c;
}
function palDraw(){const q=$('pi').value.toLowerCase();PL=cmds().filter(c=>c.t.toLowerCase().includes(q)).slice(0,40);PI=Math.min(PI,Math.max(PL.length-1,0));
  $('pl').innerHTML=PL.map((c,i)=>`<li class="${i===PI?'on':''}" data-pi="${i}">${esc(c.t)}</li>`).join('')||'<li><small>No match</small></li>'}
function openPal(){if(!X)return;$('pal').hidden=false;$('pi').value='';PI=0;palDraw();$('pi').focus()}
function closePal(){$('pal').hidden=true}
$('pi').oninput=()=>{PI=0;palDraw()};
$('pal').addEventListener('click',e=>{if(e.target===$('pal'))return closePal();const li=e.target.closest('[data-pi]');if(li){const c=PL[+li.dataset.pi];closePal();c&&c.f()}});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('pal').hidden?openPal():closePal();return}
  if($('pal').hidden)return;
  if(e.key==='Escape')closePal();
  if(e.key==='ArrowDown'){e.preventDefault();PI=Math.min(PI+1,PL.length-1);palDraw()}
  if(e.key==='ArrowUp'){e.preventDefault();PI=Math.max(PI-1,0);palDraw()}
  if(e.key==='Enter'){e.preventDefault();const c=PL[PI];closePal();c&&c.f()}
});
</script></body></html>
